schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Продукт: BUDB («Best Undefined DataBase») — база данных Имён и Телефонов,
  написанная с нуля на Rust. Визуальный веб-интерфейс + программное HTTP API + Admin CLI.
  Поиск телефонов по имени (точно и по префиксу) и имён по телефону (точно и по префиксу),
  надёжное хранение большого числа записей (цель проектирования 10^8 контактов на одном узле).
  Change v1: add-phonebook-db-v1 (15 capabilities, см. docs/orchestrator-decisions.md D-029).

  Заказчик: оркестратор (Elephant) выступает прокси заказчика; человек в процессе не участвует
  (D-008). Решения заказчика — в docs/orchestrator-decisions.md (D-001…D-029); не противоречь им,
  а при конфликте фиксируй вопрос в разделе «ВОПРОСЫ К ОРКЕСТРАТОРУ».
  Пишем только спецификацию; код не пишем.

  Ключевые ограничения:
  - С нуля: запрещено использовать существующие СУБД, KV-хранилища, движки индексов/WAL/транзакций,
    ORM и т.п.; разрешённые зависимости — только allowlist политики зависимостей (D-021).
  - Язык реализации Rust (D-020); поведенческие спецификации технологически нейтральны,
    стек/движок описываются в ADR и design.md (D-007); «написано с нуля на Rust» — одно явное
    требование-ограничение (capability build-constraints) со ссылкой на ADR.
  - Персональные данные: ПДн не в URL, маскирование в логах, корзина и очистка по запросу
    субъекта (D-012, D-013, 152-ФЗ).

  Формат спецификаций:
  - Текст на русском; нормативные слова SHALL/MUST — по-английски, ЗАГЛАВНЫМИ, отдельным словом,
    в теле требования (не только в заголовке); `openspec validate --strict` должен проходить.
  - Одно поведение на требование; описание требования ≤ 500 символов.
  - Сценарии — ровно `#### Scenario: <название>` со строками `- **WHEN** …` / `- **THEN** …`
    (допустимо `- **AND** …`); минимум один сценарий на требование.
  - Каждое требование трассируется к CUJ строкой `Трассировка: CUJ-NN` (CUJ-01…CUJ-10, docs/cuj.md).
  - Имена каталогов capability — kebab-case латиницей.

  Fact Grounding: каждое нетривиальное утверждение о внешнем мире (стандарты, ОС, алгоритмы,
  законы, цифры) — со ссылкой на docs/research/0N-*.md (раздел); непроверенное помечать
  [НЕ ПОДТВЕРЖДЕНО], допущения — [ДОПУЩЕНИЕ].

  Где что лежит:
  - docs/research/ — исследования (источники фактов, не изменять);
  - docs/adr/NNNN-kebab-title.md — ADR в формате MADR 4.0 со статусами Nygard; не переписывать,
    а замещать новым ADR (D-005);
  - docs/cuj.md — Critical User Journeys CUJ-01…CUJ-10 (D-028);
  - docs/orchestrator-decisions.md — журнал решений заказчика-оркестратора;
  - docs/reviews/ — ревью Goldfish и экспертов (D-006).

rules:
  proposal:
    - "Явно перечисли, что вне скоупа v1 (multi-tenancy, merge дубликатов, vCard, UCA-сортировка и т.п. по журналу решений)"
    - "Capabilities — ровно список из D-029, kebab-case"
    - "Ссылайся на ID решений (D-NNN) и CUJ, а не пересказывай их"
  specs:
    - "Одно поведение на требование, описание ≤ 500 символов, SHALL/MUST заглавными в теле требования"
    - "Каждое требование содержит строку «Трассировка: CUJ-NN» и минимум один `#### Scenario:` с **WHEN**/**THEN**"
    - "Без упоминания конкретных технологий (Rust, крейтов, структур данных) — кроме capability build-constraints"
    - "Числовые лимиты и SLO — из журнала решений (D-022, D-024) или docs/research, со ссылкой на источник"
  design:
    - "Каждое решение указывает рассмотренные альтернативы и ссылается на ADR в docs/adr/"
    - "Факты о внешнем мире — со ссылкой на docs/research/0N (раздел)"
    - "Риски в форме «[Risk] → Mitigation»"
  tasks:
    - "Задачи — только по спецификации и ревью (код не пишем); у каждой задачи указан способ проверки"
    - "Проверки включают `openspec validate --all --strict` и трассировку CUJ → требования"

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
